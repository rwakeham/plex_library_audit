services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PLEX_TOKEN: ${PLEX_TOKEN}
      PLEX_BASE_URL: ${PLEX_BASE_URL}
      CACHE_TTL: ${CACHE_TTL:-300}
    ports:
      - "${PORT:-8300}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
